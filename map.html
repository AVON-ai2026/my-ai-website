/* 1. 左侧文字卡片的悬浮效果 */
g[transform]:hover rect {
  fill: #fffdf5;
  filter: drop-shadow(0px 6px 12px rgba(0,0,0,0.12));
  transition: all 0.3s ease;
}

/* 2. 右侧图片的悬浮效果（只针对 image 标签，安全放大） */
image.sticker {
  transition: all 0.3s ease;
}
image.sticker:hover {
  transform: scale(1.03);
  filter: drop-shadow(0px 8px 16px rgba(0,0,0,0.2)) brightness(1.05);
}

/* 3. 操作说明卡片的悬浮效果（只加阴影，绝不用 transform，防止乱飞） */
g.sticker {
  transition: all 0.3s ease;
  cursor: pointer;
}
g.sticker:hover {
  filter: drop-shadow(0px 8px 16px rgba(0,0,0,0.15));
}

*{margin:0;padding:0;box-sizing:border-box;}
html,body{

<!-- 把你删掉的代码放在这里，并加上 script 标签 -->
<script type="text/javascript">
  function zoomCard(el){
    // 正常状态：藏在左下角
    const stateNormal = "translate(-145, 910) scale(0.6)"; 
    // 放大状态：屏幕正中央
    const stateZoomed = "translate(200,600) scale(1.3)";

    if(el.dataset.zoom === "on"){
        el.setAttribute("transform", stateNormal);
        el.dataset.zoom = "off";
    }else{
        el.setAttribute("transform", stateZoomed);
        el.dataset.zoom = "on";
        el.parentNode.appendChild(el); // 点击时把它放到最顶层
    }
  }
</script>
