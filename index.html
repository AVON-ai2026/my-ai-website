<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的迷你世界</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  min-height: 100vh;
  font-family: "Microsoft YaHei", sans-serif;
  background: linear-gradient(180deg, #d9d3f5 0%, #b7a9e6 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px 24px 80px;
  position: relative;
}
.grass {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  height: 56px;
  background: linear-gradient(180deg, #7ed98a 0%, #49b759 100%);
  z-index: 1;
}
.page {
  position: relative;
  z-index: 2;
  width: 100%;
  max-width: 720px;
  text-align: center;
}
.avatar {
  width: 72px;
  height: 72px;
  border-radius: 50%;
  margin: 0 auto 18px;
  background: linear-gradient(135deg, #8b5cf6, #6366f1);
  border: 4px solid rgba(255,255,255,0.6);
  box-shadow: 0 10px 30px rgba(99,102,241,0.45);
  overflow: hidden;
}
.avatar img { width: 100%; height: 100%; object-fit: cover; }
h1 {
  font-size: 28px;
  color: #3b2a7a;
  letter-spacing: 2px;
  margin-bottom: 8px;
}
.subtitle {
  font-size: 13px;
  color: #5b4b9b;
  opacity: 0.85;
  margin-bottom: 36px;
}
.buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
  width: 100%;
}
.btn {
  min-height: 64px;
  border-radius: 14px;
  text-decoration: none;
  background: linear-gradient(180deg, #fff, #e4dcff);
  border: 3px solid #a78bfa;
  color: #4b3aa5;
  font-size: 17px;
  font-weight: 700;
  letter-spacing: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  box-shadow: 0 10px 24px rgba(99,102,241,0.25);
  transition: all 0.2s ease;
}
.btn:hover {
  transform: translateY(-4px);
  box-shadow: 0 18px 34px rgba(99,102,241,0.35);
}
.btn .icon {
  width: 26px; height: 26px;
  border-radius: 8px;
  background: rgba(139,92,246,0.18);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
}
@media (max-width: 640px) {
  .buttons { grid-template-columns: 1fr; gap: 14px; }
  h1 { font-size: 24px; }
  .btn { font-size: 16px; letter-spacing: 2px; }
}
</style>
</head>
<body>

<div class="grass"></div>

<div class="page">
  <div class="avatar">
    <img src="https://api.dicebear.com/7.x/pixel-art/svg?seed=Felix" alt="头像">
  </div>
  <h1>我的迷你世界</h1>
  <p class="subtitle">在迷你世界里，建造属于自己的人生方块</p>

  <div class="buttons">
    <a href="bot.html" class="btn">
      <span class="icon">📘</span>
      作品集
    </a>
    <a href="#" class="btn">
      <span class="icon">📝</span>
      日记副本
    </a>
    <a href="#" class="btn">
      <span class="icon">🗺️</span>
      人生地图
    </a>
    <a href="#" class="btn">
      <span class="icon">👤</span>
      关于我
    </a>
  </div>
</div>

</body>
</html>
