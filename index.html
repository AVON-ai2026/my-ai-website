<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的迷你世界</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  /* 封面底图：铺满全屏，居中显示 */
  background: url("./cover.jpg") center center / cover no-repeat;
  font-family: "Microsoft YaHei", sans-serif;
  position: relative;
}

/* 按钮热区：透明覆盖在图上，只负责点击 */
.btn-hotspot {
  position: absolute;
  display: block;
  text-decoration: none;
  cursor: pointer;
  background: transparent;
  border: none;
  /* 悬停时轻微高亮，不破坏原图观感 */
  transition: background 0.2s ease;
  border-radius: 12px;
}

.btn-hotspot:hover {
  background: rgba(255, 255, 255, 0.12);
}

/* 四个按钮位置（按封面比例定位，可微调） */
/* 左上：作品集 */
.btn-1 {
  top: 38%;
  left: 16%;
  width: 32%;
  height: 14%;
}

/* 右上：日记副本 */
.btn-2 {
  top: 38%;
  right: 16%;
  width: 32%;
  height: 14%;
}

/* 左下：人生地图 */
.btn-3 {
  top: 60%;
  left: 16%;
  width: 32%;
  height: 14%;
}

/* 右下：关于我 */
.btn-4 {
  top: 60%;
  right: 16%;
  width: 32%;
  height: 14%;
}

/* 手机端适配：按钮高度加大，方便点击 */
@media (max-width: 640px) {
  .btn-hotspot { height: 12%; }
  .btn-1, .btn-3 { left: 10%; width: 36%; }
  .btn-2, .btn-4 { right: 10%; width: 36%; }
}
</style>
</head>
<body>

<!-- 四个可点击热区，对应封面四个按钮 -->
<a href="bot.html" class="btn-hotspot btn-1"></a>
<a href="#" class="btn-hotspot btn-2"></a>
<a href="#" class="btn-hotspot btn-3"></a>
<a href="#" class="btn-hotspot btn-4"></a>

</body>
</html>
