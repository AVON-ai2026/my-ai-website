/* 可点击热区：覆盖在原图按钮上 */
.btn-hotspot {
  position: absolute;
  display: block;
  cursor: pointer;
  background: transparent;
  border: none;
  border-radius: 18px;
  transition:
    background 0.25s ease,
    box-shadow 0.25s ease,
    transform 0.15s ease;
  outline: 1px dashed rgba(255, 255, 255, 0);
  outline-offset: -1px;
}

/* 鼠标悬停浮动高亮效果，就是你想要的浮动反馈 */
.btn-hotspot:hover {
  background: rgba(255, 255, 255, 0.18);
  box-shadow:
    0 0 0 4px rgba(255, 255, 255, 0.35),
    0 10px 30px rgba(0, 0, 0, 0.25);
  transform: translateY(-2px);
}

/* 点击按下反馈 */
.btn-hotspot:active {
  transform: translateY(1px);
  background: rgba(255, 255, 255, 0.28);
}

/* 左上：作品集 */
.btn-1 {
  top: 34%;
  left: 14%;
  width: 34%;
  height: 16%;
}

/* 右上：日记副本 */

/* 左下：人生地图 */

}

/* 右下：关于我 */
.btn-4 {

}

/* 手机端适配 */
@media (max-width: 640px) {
  .btn-1,
  .btn-3 {

    width: 40%;

  .btn-2,
  .btn-4 {
    right: 8%;

    height: 15%;

}
