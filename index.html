<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>我的迷你世界</title>
<style>

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; }
.hotspot-svg {
  width: 100vw;
  height: 100vh;
  display: block;
}
.hotspot-rect {
  cursor: pointer;
  transition: fill 0.25s ease;
  pointer-events: all;
  fill: rgba(255,0,0,0.0);
}
.hotspot-rect:hover {
  fill: rgba(255,255,255,0.22);
}
</style>
</head>
<body>
<svg class="hotspot-svg" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice">

  <!-- 在这里粘贴你的base64那一行 -->
  <image href="home.png" width="1000" height="1000" />
<!-- 热区1：作品集 -->
<!-- 热区1：作品集 -->
<rect fill="transparent" class="hotspot-rect" x="24.7" y="46.7" width="22" height="10.3" rx="2" ry="2" 
      onclick="location.href='bot.html'"
      onmouseover="this.setAttribute('fill', 'rgba(255,255,255,0.15)'); this.setAttribute('stroke', '#ffffff'); this.setAttribute('stroke-width', '0.3'); this.style.cursor='pointer';"
      onmouseout="this.setAttribute('fill', 'transparent'); this.setAttribute('stroke', 'none');"
      style="transition: all 0.2s ease;" />

<!-- 热区2：日记副本 -->
<rect fill="transparent" class="hotspot-rect" x="53.5" y="46.7" width="22" height="10.1" rx="2" ry="2" 
      onclick="location.href='日记页面.html'"
      onmouseover="this.setAttribute('fill', 'rgba(255,255,255,0.15)'); this.setAttribute('stroke', '#ffffff'); this.setAttribute('stroke-width', '0.3'); this.style.cursor='pointer';"
      onmouseout="this.setAttribute('fill', 'transparent'); this.setAttribute('stroke', 'none');"
      style="transition: all 0.2s ease;" />

<!-- 热区3：人生地图 -->
<rect fill="transparent" class="hotspot-rect" x="24.3" y="61.6" width="22" height="10.1" rx="2" ry="2" 
      onclick="location.href="map.html"
      onmouseover="this.setAttribute('fill', 'rgba(255,255,255,0.15)'); this.setAttribute('stroke', '#ffffff'); this.setAttribute('stroke-width', '0.3'); this.style.cursor='pointer';"
      onmouseout="this.setAttribute('fill', 'transparent'); this.setAttribute('stroke', 'none');"
      style="transition: all 0.2s ease;" />

<!-- 热区4：关于我 -->
<rect fill="transparent" class="hotspot-rect" x="54" y="61.6" width="22" height="10.1" rx="2" ry="2" 
      onclick="location.href='关于我页面.html'"
      onmouseover="this.setAttribute('fill', 'rgba(255,255,255,0.10)'); this.setAttribute('stroke', '#ffffff'); this.setAttribute('stroke-width', '0.3'); this.style.cursor='pointer';"
      onmouseout="this.setAttribute('fill', 'transparent'); this.setAttribute('stroke', 'none');"
      style="transition: all 0.2s ease;" />

</svg>
</body>
</html>
