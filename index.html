<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>我的迷你世界</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  width: 100%;
  min-height: 100vh;
  overflow-x: hidden;
}

body {
  font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", sans-serif;
  background:
    radial-gradient(circle at 20% 20%, rgba(255,255,255,0.4), transparent 25%),
    radial-gradient(circle at 80% 10%, rgba(255,255,255,0.3), transparent 30%),
    linear-gradient(180deg, #d9d3f5 0%, #c7bef0 45%, #b7a9e6 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px 24px;
  position: relative;
}

/* 背景柔光云 */
body::before,
body::after {
  content: "";
  position: absolute;
  border-radius: 50%;
  filter: blur(40px);
  opacity: 0.35;
  pointer-events: none;
}

body::before {
  width: 420px;
  height: 160px;
  top: 8%;
  left: 6%;
  background: #ffffff;
}

body::after {
  width: 520px;
  height: 180px;
  top: 18%;
  right: 10%;
  background: #d7c9ff;
}

/* 底部草地 */
.grass {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  height: 56px;
  background: linear-gradient(180deg, #7ed98a 0%, #49b759 100%);
  z-index: 1;
}

.grass::before {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  height: 14px;
  background: linear-gradient(180deg, #9be27c 0%, #76c957 100%);
  clip-path: polygon(
    0 100%, 4% 40%, 9% 100%, 14% 55%, 19% 100%, 24% 50%, 29% 100%,
    34% 60%, 39% 100%, 44% 45%, 49% 100%, 54% 55%, 59% 100%, 64% 50%,
    69% 100%, 74% 60%, 79% 100%, 84% 40%, 89% 100%, 94% 55%, 100% 100%
  );
}

/* 页面容器 */
.page {
  position: relative;
  z-index: 2;
  width: 100%;
  max-width: 960px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

/* 头像 */
.avatar {
  width: 72px;
  height: 72px;
  border-radius: 50%;
  background:
    radial-gradient(circle at 35% 25%, rgba(255,255,255,0.8), transparent 35%),
    linear-gradient(135deg, #8b5cf6 0%, #6366f1 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow:
    0 0 0 4px rgba(255,255,255,0.6),
    0 10px 30px rgba(99,102,241,0.45);
  margin-bottom: 18px;
  overflow: hidden;
}

.avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 50%;
}

/* 标题 */
h1 {
  font-size: 28px;
  color: #3b2a7a;
  letter-spacing: 2px;
  margin-bottom: 8px;
  text-shadow: 0 2px 6px rgba(255,255,255,0.6);
}

.subtitle {
  font-size: 13px;
  color: #5b4b9b;
  margin-bottom: 36px;
  opacity: 0.85;
}

/* 按钮区域 */
.buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
  width: 100%;
  max-width: 720px;
}

/* 按钮 */
.btn {
  min-height: 64px;
  border-radius: 14px;
  text-decoration: none;
  background:
    linear-gradient(180deg, #ffffff 0%, #f1edff 50%, #e4dcff 100%);
  border: 3px solid #a78bfa;
  color: #4b3aa5;
  font-size: 17px;
  font-weight: 700;
  letter-spacing: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,0.8),
    0 10px 24px rgba(99,102,241,0.25);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
  padding: 0 18px;
}

.btn:hover {
  transform: translateY(-4px);
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,0.9),
    0 18px 34px rgba(99,102,241,0.35);
}

.btn .icon {
  width: 26px;
  height: 26px;
  border-radius: 8px;
  background: rgba(139,92,246,0.18);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
}

/* 窄屏自动变单列 */
@media (max-width: 640px) {
  .buttons {
    grid-template-columns: 1fr;
    gap: 14px;
  }

  h1 {
    font-size: 24px;
  }

  .btn {
    font-size: 16px;
    letter-spacing: 2px;
  }
}
</style>
</head>

<body>

<div class="grass"></div>

<div class="page">
  <div class="avatar">
    <img src="https://picsum.photos/seed/miniworld-avatar/200/200" alt="头像" />
  </div>

  <h1>我的迷你世界</h1>
  <p class="subtitle">在迷你世界里，建造属于自己的人生方块</p>

  <div class="buttons">
    <a href="#" class="btn">
      <span class="icon">📘</span>
      作品集
    </a>
    <a href="#" class="btn">
      <span class="icon">📝</span>
      日记副本
    </a>
    <a href="#" class="btn">
      <span class="icon">🗺️</span>
      人生地图
    </a>
    <a href="#" class="btn">
      <span class="icon">👤</span>
      关于我
    </a>
  </div>
</div>

</body>
</html>
