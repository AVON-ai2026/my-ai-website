<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的迷你世界</title>
    <style>
        :root{
            --light-purple-bg:#f3eef9;
            --card-bg:#f7f2fc;
            --text-main:#4b3863;
            --text-sub:#7c6b94;
            --border-color:#b8a2d8;
            --title-color:#3f2c56;
            --primary-purple:#d8c8ee;
            --ink-black:#332842;
            --mini-pink:#e8dcf5;
        }

        body{
            background-color: var(--light-purple-bg);
            background-image: 
                linear-gradient(180deg, rgba(243,238,249,0.92), rgba(239,230,244,0.92)),
                url("https://www.transparenttextures.com/patterns/paper-fibers.png");
            background-size: auto, 300px 300px;
            color:var(--text-main);
            font-family: "Noto Serif SC", "Source Han Serif SC", "SimSun", "Microsoft YaHei", serif;
            margin:0;
            padding-bottom:40px;
        }

        /* 淡淡的背景装饰层 */
        .ancient-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://images.unsplash.com/photo-1579546929518-9e396f3cc809?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            opacity: 0.12;
            z-index: -1;
        }

        /* 方块卡片 */
        .mini-block{
            background-color:var(--card-bg);
            border:3px solid var(--border-color);
            box-shadow: 3px 3px 8px rgba(150,120,190,0.15);
            border-radius:4px;
            padding:20px;
            margin:15px;
            width:200px;
            cursor:pointer;
            transition: all 0.25s ease;
        }
        .mini-block:hover{
            transform: translateY(-3px);
            box-shadow: 4px 6px 14px rgba(150,120,190,0.25);
            background-color: var(--mini-pink);
        }
        .mini-block h3 {
            margin: 0 0 10px 0;
            font-size: 20px;
            color:var(--title-color);
        }
        .mini-block p {
            margin: 0;
            font-size: 14px;
            color: var(--text-sub);
        }

        /* 头像 */
        .avatar {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 4px solid var(--border-color);
            box-shadow: 0 0 18px rgba(184,162,216,0.4);
            object-fit: cover;
            margin-top: 50px;
        }

        /* 手机适配 */
        @media (max-width: 600px) {
            .mini-block {
                width: 80%;
                margin: 10px auto;
                display: block;
            }
        }
    </style>
</head>
<body>
    <div class="ancient-bg"></div>
    
    <!-- 首页头部 -->
    <div style="text-align: center;">
        <img src="https://api.dicebear.com/7.x/pixel-art/svg?seed=Felix" alt="我的头像" class="avatar">
        <h1 style="color: var(--title-color); margin-top: 20px; font-size: 32px; letter-spacing: 2px;">我的迷你世界</h1>
        <p style="color: var(--text-sub); font-size: 18px;">在迷你世界里，建造属于自己的人生方块</p>
    </div>

    <!-- 方块按钮组 -->
    <div style="display: flex; flex-wrap: wrap; justify-content: center; max-width: 800px; margin: 30px auto;">
        
        <div class="mini-block" onclick="location.href='bot.html'">
            <h3>🤖 作品集</h3>
            <p>我建造的AI方块</p>
        </div>

        <div class="mini-block" onclick="alert('日记副本正在装修中，敬请期待...')">
            <h3>📖 日记副本</h3>
            <p>我隐藏的私密空间</p>
        </div>
        
        <div class="mini-block" onclick="alert('探索中...')">
            <h3>🗺️ 人生地图</h3>
            <p>我探索的开放世界</p>
        </div>
        
        <div class="mini-block" onclick="alert('角色介绍加载中...')">
            <h3>🧑‍🌾 关于我</h3>
            <p>我的角色介绍</p>
        </div>
    </div>
</body>
</html>
